name: Meme Radar

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 4 1 * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meme-radar
  cancel-in-progress: false

jobs:
  radar:
    if: github.event.schedule != '17 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Robot (news, prix, notifications)
        run: node scripts/radar.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_MIN: ${{ vars.NOTIFY_MIN }}
          NOTIFY_GENERAL: ${{ vars.NOTIFY_GENERAL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  keepalive:
    if: github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "meme-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "Garde le robot actif" && git push
